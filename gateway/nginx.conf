worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    # ============================================================
    # API Gateway · 统一入口
    # ============================================================

    # 后端 API（Spring Boot 模块化单体，可水平扩展为多实例）
    upstream backend_api {
        server backend:8080;
        keepalive 32;
    }

    # 用户端前端（静态站点）
    upstream frontend_user {
        server frontend-user:80;
    }

    # 管理端前端（静态站点）
    upstream frontend_admin {
        server frontend-admin:80;
    }

    # ---------- 主入口 :80 ----------
    server {
        listen 80;
        server_name _;

        access_log /var/log/nginx/gateway.log main;

        # --- 统一 API 路由 ---
        location /api/ {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # CORS 由后端 WebConfig 统一处理（同域部署时不会触发），网关不重复下发响应头
        }

        # --- 用户端 SPA ---
        location / {
            proxy_pass http://frontend_user;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # --- 管理端 SPA（缺省尾斜杠时重定向，避免落到用户端首页）---
        # 关闭绝对地址重定向：否则 nginx 会拼出 http://<host>/admin/（丢掉端口），
        # 在 8080 等非 80 端口 / 端口映射场景下会跳到错误地址
        absolute_redirect off;
        location = /admin {
            return 301 /admin/;
        }
        location /admin/ {
            # 先 proxy 到 admin 前端，但需要去掉 /admin 前缀
            rewrite ^/admin/(.*) /$1 break;
            proxy_pass http://frontend_admin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # --- 健康检查 ---
        location /health {
            return 200 "gateway ok";
            add_header Content-Type text/plain;
        }
    }
}
